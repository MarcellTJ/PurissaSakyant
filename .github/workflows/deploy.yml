name: Deploy public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare public preview
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Adjust this build only; repository source stays unchanged.
          for path in Path("src").rglob("*"):
              if path.suffix in {".js", ".jsx", ".json", ".css"}:
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("/assets/", "/PurissaSakyant/assets/")
                  path.write_text(text, encoding="utf-8")

          # Hash routing allows page refreshes on GitHub Pages.
          path = Path("src/main.jsx")
          text = path.read_text(encoding="utf-8")
          path.write_text(
              text.replace("BrowserRouter", "HashRouter"),
              encoding="utf-8",
          )

          # Use bundled content because Pages has no backend.
          path = Path("src/content.jsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "async function load() {",
              "async function load() { return;",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Build frontend
        run: npx vite build --base=/PurissaSakyant/ --outDir=dist-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4